server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # Redirects must keep the scheme and host the public nginx saw, not this
    # container's — otherwise a directory redirect lands the visitor on http://localhost.
    absolute_redirect off;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml application/rss+xml image/svg+xml
                      font/ttf font/otf application/vnd.ms-fontobject;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output — safe to cache forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The site is built with trailingSlash: true, so every page is a directory
    # holding index.html. The $uri.html fallback covers the few files Docusaurus
    # emits flat (404.html, and anything a plugin writes without a directory).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Docusaurus' own 404, so an unknown path keeps the site's layout and
    # navigation instead of nginx's bare page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
