name: Build & Deploy Docs

on:
  push:
    branches: [production]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Clone docs repo
        run: |
          if [ -n "${{ secrets.DOCS_REPO_TOKEN }}" ]; then
            git clone https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/verificahub/verificahub-docs.git external-docs
          else
            git clone https://github.com/verificahub/verificahub-docs.git external-docs
          fi

      - name: Replace docs and i18n folders
        run: |
          rm -rf docs
          test -d external-docs/docs
          mv external-docs/docs ./docs
          rm -rf i18n
          if [ -d external-docs/i18n ]; then
            mv external-docs/i18n ./i18n
          fi
          # OpenAPI spec + examples source of truth lives in the docs repo
          # (verificahub-docs/openapi/). If present, it overrides the fallback
          # copy committed here; the API reference is generated from it at build.
          if [ -d external-docs/openapi ]; then
            cp -R external-docs/openapi/. ./openapi/
            echo "Using OpenAPI spec from docs repo:"; ls -1 ./openapi/
          fi

      - name: Verify copied docs content
        run: |
          test -f docs/index.md || (echo "docs/index.md missing after copy" && exit 1)

      - name: Copy registry links for static endpoint
        working-directory: external-docs
        run: |
          if [ -f registry/links.json ]; then
            mkdir -p ../static
            cp registry/links.json ../static/links.json
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          DOCSEARCH_APP_ID: ${{ secrets.DOCSEARCH_APP_ID }}
          DOCSEARCH_API_KEY: ${{ secrets.DOCSEARCH_API_KEY }}
          DOCSEARCH_INDEX_NAME: ${{ secrets.DOCSEARCH_INDEX_NAME }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
